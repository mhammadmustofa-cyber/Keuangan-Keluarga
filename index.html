<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keuangan Keluarga</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --orange-primary: #f97316;
      --border-color: #e2e8f0;
      --income: #10b981;
      --expense: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: 80px;
    }

    /* Header Profile */
    .header-profile {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 20px 10px 20px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--orange-primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .greeting-name {
      font-size: 18px;
      font-weight: 800;
    }

    .header-icons {
      display: flex;
      gap: 16px;
    }

    .icon-btn {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .icon-btn span {
      font-size: 20px;
      display: block;
    }

    /* Ringkasan Saldo Card */
    .summary-container {
      padding: 10px 20px;
    }

    .balance-card {
      background: linear-gradient(135deg, #ff8a00 0%, #e55300 100%);
      color: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.25);
    }

    .balance-label {
      font-size: 12px;
      opacity: 0.9;
      font-weight: 600;
    }

    .balance-amount {
      font-size: 26px;
      font-weight: 800;
      margin: 4px 0 16px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .summary-item {
      display: flex;
      flex-direction: column;
    }

    .summary-item span {
      font-size: 11px;
      opacity: 0.85;
    }

    .summary-item strong {
      font-size: 14px;
      font-weight: 700;
      margin-top: 2px;
    }

    /* Section Header */
    .section-header {
      padding: 16px 20px 10px 20px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 800;
    }

    /* Fitur 3 Menu Utama */
    .features-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 0 20px;
    }

    .feature-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      cursor: pointer;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .feature-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .bg-in { background: #d1fae5; color: #059669; }
    .bg-out { background: #fee2e2; color: #dc2626; }
    .bg-history { background: #e0f2fe; color: #0284c7; }

    .feature-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
    }

    /* Form Box */
    .card-box {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      margin: 16px 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
    }

    input, select, button {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--orange-primary);
    }

    .btn-submit {
      background: var(--orange-primary);
      color: white;
      border: none;
      font-weight: 700;
      border-radius: 20px;
      padding: 12px;
      cursor: pointer;
      margin-top: 6px;
    }

    .btn-cancel {
      background: #94a3b8;
      color: white;
      border: none;
      font-weight: 700;
      border-radius: 20px;
      padding: 8px;
      cursor: pointer;
      display: none;
    }

    /* Tampilan Rekening Koran Bulanan */
    .month-card {
      background: var(--card-bg);
      border-radius: 16px;
      margin: 0 20px 16px 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      overflow: hidden;
    }

    .month-header {
      background: #f1f5f9;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .month-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .month-summary {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .month-summary .m-in { color: var(--income); }
    .month-summary .m-out { color: var(--expense); }

    .transaction-list {
      list-style: none;
      padding: 0 16px;
    }

    .transaction-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .transaction-item:last-child {
      border-bottom: none;
    }

    .tx-info h4 {
      font-size: 13px;
      font-weight: 700;
    }

    .tx-info p {
      font-size: 11px;
      color: var(--text-muted);
    }

    .tx-right {
      text-align: right;
    }

    .amount {
      font-weight: 800;
      font-size: 13px;
    }

    .amount.pemasukan { color: var(--income); }
    .amount.pengeluaran { color: var(--expense); }

    .action-btns {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 4px;
    }

    .btn-action {
      background: none;
      border: none;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      padding: 2px 0;
    }

    .btn-delete { color: var(--expense); }
    .btn-edit { color: var(--orange-primary); }

    /* Modal Nota */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-content {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .modal-content img {
      max-width: 100%;
      max-height: 350px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .btn-close {
      background: var(--orange-primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      margin-top: 12px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Header Profile -->
  <div class="header-profile">
    <div class="user-info">
      <div class="avatar-circle">🏠</div>
      <div class="greeting-name">Keuangan Keluarga</div>
    </div>
    <div class="header-icons">
      <div class="icon-btn">
        <span>🔔</span> Notifikasi
      </div>
    </div>
  </div>

  <!-- Ringkasan Saldo Utama -->
  <div class="summary-container">
    <div class="balance-card">
      <div class="balance-label">Total Saldo saat ini</div>
      <div class="balance-amount">
        <span id="bal-total">Rp ********</span>
        <span style="font-size: 16px; cursor: pointer;" onclick="toggleHideSaldo()">👁️</span>
      </div>
      <div class="summary-grid">
        <div class="summary-item">
          <span>Total Pemasukan</span>
          <strong id="bal-in">Rp 0</strong>
        </div>
        <div class="summary-item">
          <span>Total Pengeluaran</span>
          <strong id="bal-out">Rp 0</strong>
        </div>
      </div>
    </div>
  </div>

  <!-- Fitur Pilihan (3 Menu Utama) -->
  <div class="section-header">
    <div class="section-title">Fitur Utama</div>
  </div>

  <div class="features-grid-3">
    <div class="feature-card" onclick="selectMenu('pemasukan')">
      <div class="feature-icon bg-in">📥</div>
      <div class="feature-label">Pemasukan</div>
    </div>
    <div class="feature-card" onclick="selectMenu('pengeluaran')">
      <div class="feature-icon bg-out">📤</div>
      <div class="feature-label">Pengeluaran</div>
    </div>
    <div class="feature-card" onclick="scrollToHistory()">
      <div class="feature-icon bg-history">📜</div>
      <div class="feature-label">Rekening Koran</div>
    </div>
  </div>

  <!-- Form Transaksi -->
  <div class="card-box" id="form-container">
    <div style="font-size: 14px; font-weight: 800; margin-bottom: 12px; color: var(--text-main);" id="form-title">
      Tambah Transaksi Baru
    </div>
    <form id="tx-form" onsubmit="saveTransaction(event)">
      <input type="hidden" id="tx-id">
      <input type="hidden" id="tx-receipt-data">

      <div class="input-group">
        <label for="date">Tanggal</label>
        <input type="date" id="date" required>
      </div>

      <div class="input-group">
        <label for="desc">Keterangan</label>
        <input type="text" id="desc" placeholder="Contoh: Belanja Bulanan / Gaji" required>
      </div>

      <div class="input-group">
        <label for="amount">Jumlah (Rp)</label>
        <input type="number" id="amount" placeholder="0" required>
      </div>

      <div class="input-group">
        <label for="type">Jenis Transaksi</label>
        <select id="type">
          <option value="pengeluaran">Pengeluaran</option>
          <option value="pemasukan">Pemasukan</option>
        </select>
      </div>

      <div class="input-group">
        <label for="wallet">Sumber / Dompet</label>
        <select id="wallet">
          <option value="bank">Bank / Rekening</option>
          <option value="cash">Tunai (Cash)</option>
          <option value="ewallet">E-Wallet</option>
        </select>
      </div>

      <div class="input-group">
        <label for="category">Kategori</label>
        <select id="category">
          <option value="Makanan">Makanan & Minuman</option>
          <option value="Transport">Transportasi</option>
          <option value="Belanja">Belanja / Kebutuhan</option>
          <option value="Gaji">Gaji / Pendapatan</option>
          <option value="Lainnya">Lain-lain</option>
        </select>
      </div>

      <div class="input-group">
        <label for="receipt">Bukti Transaksi (Gambar)</label>
        <input type="file" id="receipt" accept="image/*" onchange="handleImageUpload(event)">
      </div>

      <button type="submit" id="btn-submit" class="btn-submit">Simpan Transaksi</button>
      <button type="button" id="btn-cancel" class="btn-cancel" onclick="resetForm()">Batal Edit</button>
    </form>
  </div>

  <!-- Section Title Riwayat Transaksi / Rekening Koran -->
  <div class="section-header" id="history-container">
    <div class="section-title">Rekening Koran (Riwayat Per Bulan)</div>
  </div>

  <!-- Container Riwayat Transaksi Per Bulan -->
  <div id="monthly-history-wrapper"></div>

  <!-- Modal View Nota -->
  <div class="modal" id="receipt-modal">
    <div class="modal-content">
      <h4 style="font-size: 15px;">Bukti Transaksi</h4>
      <img id="modal-img" src="" alt="Bukti Transaksi">
      <button class="btn-close" onclick="closeModal()">Tutup</button>
    </div>
  </div>

  <!-- Load SDK Firebase Compat Version -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDWVKUMsOgZ_RQkva2sKPT_KatNxkJlrWA",
      authDomain: "keuangan-english-club.firebaseapp.com",
      databaseURL: "https://keuangan-english-club-default-rtdb.firebaseio.com",
      projectId: "keuangan-english-club",
      storageBucket: "keuangan-english-club.firebasestorage.app",
      messagingSenderId: "799661651204",
      appId: "1:799661651204:web:8502ea6bdcbd2efbb94c51",
      measurementId: "G-TQH2MK7MXZ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    document.getElementById('date').valueAsDate = new Date();

    let isSaldoHidden = true;
    let totalIncome = 0;
    let totalExpense = 0;

    function toggleHideSaldo() {
      isSaldoHidden = !isSaldoHidden;
      updateSaldoDisplay();
    }

    function updateSaldoDisplay() {
      const saldoEl = document.getElementById('bal-total');
      const inEl = document.getElementById('bal-in');
      const outEl = document.getElementById('bal-out');
      const totalBalance = totalIncome - totalExpense;

      if (isSaldoHidden) {
        saldoEl.innerText = "Rp ********";
        inEl.innerText = "Rp ********";
        outEl.innerText = "Rp ********";
      } else {
        saldoEl.innerText = `Rp ${totalBalance.toLocaleString('id-ID')}`;
        inEl.innerText = `Rp ${totalIncome.toLocaleString('id-ID')}`;
        outEl.innerText = `Rp ${totalExpense.toLocaleString('id-ID')}`;
      }
    }

    function selectMenu(typeVal) {
      document.getElementById('type').value = typeVal;
      document.getElementById('form-container').scrollIntoView({ behavior: 'smooth' });
    }

    function scrollToHistory() {
      document.getElementById('history-container').scrollIntoView({ behavior: 'smooth' });
    }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onloadend = function() {
          document.getElementById('tx-receipt-data').value = reader.result;
        }
        reader.readAsDataURL(file);
      }
    }

    function saveTransaction(e) {
      e.preventDefault();
      const id = document.getElementById('tx-id').value;
      const date = document.getElementById('date').value;
      const desc = document.getElementById('desc').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const type = document.getElementById('type').value;
      const wallet = document.getElementById('wallet').value;
      const category = document.getElementById('category').value;
      const receipt = document.getElementById('tx-receipt-data').value || "";

      const txData = { date, desc, amount, type, wallet, category, receipt, timestamp: Date.now() };

      if (id) {
        db.ref('transactions/' + id).update(txData);
      } else {
        db.ref('transactions').push(txData);
      }

      resetForm();
    }

    function editTransaction(id, date, desc, amount, type, wallet, category, receipt) {
      document.getElementById('tx-id').value = id;
      document.getElementById('date').value = date;
      document.getElementById('desc').value = desc;
      document.getElementById('amount').value = amount;
      document.getElementById('type').value = type;
      document.getElementById('wallet').value = wallet;
      document.getElementById('category').value = category;
      document.getElementById('tx-receipt-data').value = receipt || "";

      document.getElementById('form-title').innerText = 'Edit Transaksi';
      document.getElementById('btn-submit').innerText = 'Update Transaksi';
      document.getElementById('btn-cancel').style.display = 'block';
      document.getElementById('form-container').scrollIntoView({ behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('tx-id').value = '';
      document.getElementById('tx-receipt-data').value = '';
      document.getElementById('tx-form').reset();
      document.getElementById('date').valueAsDate = new Date();
      document.getElementById('form-title').innerText = 'Tambah Transaksi Baru';
      document.getElementById('btn-submit').innerText = 'Simpan Transaksi';
      document.getElementById('btn-cancel').style.display = 'none';
    }

    function deleteTransaction(id) {
      if (confirm('Apakah Anda yakin ingin menghapus transaksi ini?')) {
        db.ref('transactions/' + id).remove();
      }
    }

    function showReceipt(receiptData) {
      document.getElementById('modal-img').src = receiptData;
      document.getElementById('receipt-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('receipt-modal').style.display = 'none';
    }

    const monthNames = [
      "Januari", "Februari", "Maret", "April", "Mei", "Juni",
      "Juli", "Agustus", "September", "Oktober", "November", "Desember"
    ];

    db.ref('transactions').on('value', (snapshot) => {
      const data = snapshot.val();
      totalIncome = 0;
      totalExpense = 0;

      const wrapper = document.getElementById('monthly-history-wrapper');
      wrapper.innerHTML = '';

      if (!data) {
        wrapper.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 13px; padding: 20px;">Belum ada riwayat transaksi</div>';
        updateSaldoDisplay();
        return;
      }

      // Format dan Kelompokkan Transaksi Berdasarkan Bulan & Tahun (YYYY-MM)
      const grouped = {};

      Object.keys(data).forEach(key => {
        const tx = data[key];
        tx.id = key;

        // Hitung total akumulasi global
        if (tx.type === 'pemasukan') {
          totalIncome += tx.amount;
        } else {
          totalExpense += tx.amount;
        }

        // Tentukan Kunci Bulan
        let yearMonth = "Lainnya";
        if (tx.date) {
          const d = new Date(tx.date);
          if (!isNaN(d.getTime())) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            yearMonth = `${y}-${m}`;
          }
        }

        if (!grouped[yearMonth]) {
          grouped[yearMonth] = [];
        }
        grouped[yearMonth].push(tx);
      });

      // Urutkan Bulan dari Terbaru ke Terlama
      const sortedMonths = Object.keys(grouped).sort().reverse();

      sortedMonths.forEach(ym => {
        const items = grouped[ym];
        
        // Urutkan item transaksi dari tanggal terbaru
        items.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

        let mIn = 0;
        let mOut = 0;

        items.forEach(item => {
          if (item.type === 'pemasukan') mIn += item.amount;
          else mOut += item.amount;
        });

        // Parse judul bulan
        let headerTitle = "Transaksi Lainnya";
        if (ym !== "Lainnya") {
          const [year, month] = ym.split('-');
          headerTitle = `${monthNames[parseInt(month, 10) - 1]} ${year}`;
        }

        // Buat Elemen Kartu Bulan (Rekening Koran)
        const monthCard = document.createElement('div');
        monthCard.className = 'month-card';

        let listHtml = '';
        items.forEach(tx => {
          const hasReceipt = tx.receipt && tx.receipt.length > 0;
          listHtml += `
            <li class="transaction-item">
              <div class="tx-info">
                <h4>${tx.desc}</h4>
                <p>${tx.date || '-'} • ${tx.category}</p>
              </div>
              <div class="tx-right">
                <div class="amount ${tx.type}">
                  ${tx.type === 'pemasukan' ? '+' : '-'} Rp ${tx.amount.toLocaleString('id-ID')}
                </div>
                <div class="action-btns">
                  ${hasReceipt ? `<button class="btn-action btn-edit" onclick="showReceipt('${tx.receipt}')">Bukti</button>` : ''}
                  <button class="btn-action btn-edit" onclick="editTransaction('${tx.id}', '${tx.date || ''}', '${tx.desc}', ${tx.amount}, '${tx.type}', '${tx.wallet}', '${tx.category}', '${tx.receipt || ''}')">Edit</button>
                  <button class="btn-action btn-delete" onclick="deleteTransaction('${tx.id}')">Hapus</button>
                </div>
              </div>
            </li>
          `;
        });

        monthCard.innerHTML = `
          <div class="month-header">
            <div class="month-title">${headerTitle}</div>
            <div class="month-summary">
              <span class="m-in">Masuk: +Rp ${mIn.toLocaleString('id-ID')}</span>
              <span class="m-out">Keluar: -Rp ${mOut.toLocaleString('id-ID')}</span>
            </div>
          </div>
          <ul class="transaction-list">
            ${listHtml}
          </ul>
        `;

        wrapper.appendChild(monthCard);
      });

      updateSaldoDisplay();
    });
  </script>
</body>
</html>
