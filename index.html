<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keuangan Keluarga - Catatan Finansial Berkah</title>
  <style>
    :root {
      /* Palette BSI Syariah */
      --bsi-teal: #00828a;
      --bsi-teal-dark: #005e64;
      --bsi-gold: #e2a028;
      --bsi-bg: #e8f0eb;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --income: #059669;
      --expense: #dc2626;
    }

    body.dark-mode {
      --bsi-bg: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bsi-bg);
      color: var(--text-color);
      padding-bottom: 30px;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Header Utama Khas BSI */
    .bsi-header {
      background: linear-gradient(135deg, var(--bsi-teal) 0%, var(--bsi-teal-dark) 100%);
      color: white;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 12px rgba(0, 130, 138, 0.2);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Logo Bintang/Cresent Syariah BSI */
    .bsi-logo {
      width: 42px;
      height: 42px;
      background: var(--bsi-gold);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 22px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.1;
    }

    .brand-subtitle {
      font-size: 12px;
      color: #e2e8f0;
      font-style: italic;
    }

    .theme-toggle-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Layout Utama Grid Responsive */
    .main-container {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
    }

    @media (max-width: 850px) {
      .main-container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid var(--border-color);
      position: relative;
    }

    /* Motif Islami / Batik Frame Khas BSI */
    .card-bsi-frame {
      border: 3px double var(--bsi-teal);
      background-color: var(--card-bg);
      background-image: radial-gradient(var(--bsi-gold) 0.5px, transparent 0.5px);
      background-size: 12px 12px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--bsi-teal-dark);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .saldo-display {
      text-align: center;
      padding: 10px 0;
    }

    .saldo-amount {
      font-size: 32px;
      font-weight: 800;
      color: var(--bsi-teal-dark);
      margin-top: 4px;
    }

    /* Form Input */
    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-color);
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1.5px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-color);
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--bsi-teal);
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--bsi-teal) 0%, var(--bsi-teal-dark) 100%);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 25px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 10px rgba(0, 130, 138, 0.3);
    }

    .btn-cancel {
      background-color: var(--text-muted);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 25px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }

    /* List Transaksi */
    .transaction-list {
      list-style: none;
    }

    .transaction-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px dashed var(--border-color);
    }

    .transaction-item:last-child {
      border-bottom: none;
    }

    .tx-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tx-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
    }

    .tx-icon.pemasukan { background: #d1fae5; color: var(--income); }
    .tx-icon.pengeluaran { background: #fee2e2; color: var(--expense); }

    .tx-info h4 {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-color);
    }

    .tx-info p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .tx-right {
      text-align: right;
    }

    .amount {
      font-weight: 800;
      font-size: 15px;
    }

    .amount.pemasukan { color: var(--income); }
    .amount.pengeluaran { color: var(--expense); }

    .action-btns {
      margin-top: 4px;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn-action {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
    }

    .btn-delete { color: var(--expense); }
    .btn-edit { color: var(--bsi-teal); }
    .btn-nota { color: var(--bsi-gold); }

    /* Modal Nota */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-content {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .modal-content img {
      max-width: 100%;
      max-height: 350px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .btn-close {
      background: var(--bsi-teal);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      margin-top: 12px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Header BSI Keuangan Keluarga -->
  <div class="bsi-header">
    <div class="brand-section">
      <div class="bsi-logo">☪</div>
      <div>
        <div class="brand-title">Keuangan Keluarga</div>
        <div class="brand-subtitle">Catatan Finansial Simpel & Berkah</div>
      </div>
    </div>
    <button class="theme-toggle-btn" onclick="toggleTheme()">☀️ Mode Terang</button>
  </div>

  <div class="main-container">
    <!-- Kolom Kiri: Ringkasan Saldo & Form -->
    <div>
      <div class="card card-bsi-frame">
        <div class="card-title">RINGKASAN SALDO</div>
        <div class="saldo-display">
          <div class="saldo-amount" id="total-saldo">Rp 0</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title" id="form-title" style="text-align: left;">TAMBAH TRANSAKSI BARU</div>
        <form id="tx-form" onsubmit="saveTransaction(event)">
          <input type="hidden" id="tx-id">
          <input type="hidden" id="tx-receipt-data">

          <div class="input-group">
            <label for="date">Tanggal</label>
            <input type="date" id="date" required>
          </div>

          <div class="input-group">
            <label for="desc">Keterangan</label>
            <input type="text" id="desc" placeholder="Keterangan" required>
          </div>

          <div class="input-group">
            <label for="amount">Jumlah (Rp)</label>
            <input type="number" id="amount" placeholder="0" required>
          </div>

          <div class="input-group">
            <label for="type">Jenis Transaksi</label>
            <select id="type">
              <option value="pemasukan">Pemasukan</option>
              <option value="pengeluaran">Pengeluaran</option>
            </select>
          </div>

          <div class="input-group">
            <label for="wallet">Sumber / Dompet</label>
            <select id="wallet">
              <option value="bank">Tans Syariah Wallet</option>
              <option value="cash">Cash</option>
              <option value="ewallet">E-Wallet</option>
            </select>
          </div>

          <div class="input-group">
            <label for="category">Kategori</label>
            <select id="category">
              <option value="Pemasukan">Pemasukan</option>
              <option value="Pengeluaran">Pengeluaran</option>
              <option value="Makanan">Makanan & Minuman</option>
              <option value="Transport">Transportasi</option>
              <option value="Iuran">Iuran / Zakat</option>
            </select>
          </div>

          <div class="input-group">
            <label for="receipt">Upload / Lampirkan Nota (Gambar)</label>
            <input type="file" id="receipt" accept="image/*" onchange="handleImageUpload(event)">
          </div>

          <button type="submit" id="btn-submit" class="btn-submit">Simpan Transaksi</button>
          <button type="button" id="btn-cancel" class="btn-cancel" onclick="resetForm()">Batal Edit</button>
        </form>
      </div>
    </div>

    <!-- Kolom Kanan: Riwayat Transaksi -->
    <div>
      <div class="card">
        <div class="card-title" style="text-align: center;">RIWAYAT TRANSAKSI</div>
        <ul class="transaction-list" id="tx-list"></ul>
      </div>
    </div>
  </div>

  <!-- Modal View Nota -->
  <div class="modal" id="receipt-modal">
    <div class="modal-content">
      <h4 style="font-size: 16px;">Bukti Nota Transaksi</h4>
      <img id="modal-img" src="" alt="Nota Transaksi">
      <button class="btn-close" onclick="closeModal()">Tutup</button>
    </div>
  </div>

  <!-- Load SDK Firebase Compat Version -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <!-- Firebase Logic -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDWVKUMsOgZ_RQkva2sKPT_KatNxkJlrWA",
      authDomain: "keuangan-english-club.firebaseapp.com",
      databaseURL: "https://keuangan-english-club-default-rtdb.firebaseio.com",
      projectId: "keuangan-english-club",
      storageBucket: "keuangan-english-club.firebasestorage.app",
      messagingSenderId: "799661651204",
      appId: "1:799661651204:web:8502ea6bdcbd2efbb94c51",
      measurementId: "G-TQH2MK7MXZ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    document.getElementById('date').valueAsDate = new Date();

    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
    }

    let currentReceiptBase64 = "";
    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onloadend = function() {
          currentReceiptBase64 = reader.result;
          document.getElementById('tx-receipt-data').value = reader.result;
        }
        reader.readAsDataURL(file);
      }
    }

    function saveTransaction(e) {
      e.preventDefault();
      const id = document.getElementById('tx-id').value;
      const date = document.getElementById('date').value;
      const desc = document.getElementById('desc').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const type = document.getElementById('type').value;
      const wallet = document.getElementById('wallet').value;
      const category = document.getElementById('category').value;
      const receipt = document.getElementById('tx-receipt-data').value || "";

      const txData = { date, desc, amount, type, wallet, category, receipt, timestamp: Date.now() };

      if (id) {
        db.ref('transactions/' + id).update(txData);
      } else {
        db.ref('transactions').push(txData);
      }

      resetForm();
    }

    function editTransaction(id, date, desc, amount, type, wallet, category, receipt) {
      document.getElementById('tx-id').value = id;
      document.getElementById('date').value = date;
      document.getElementById('desc').value = desc;
      document.getElementById('amount').value = amount;
      document.getElementById('type').value = type;
      document.getElementById('wallet').value = wallet;
      document.getElementById('category').value = category;
      document.getElementById('tx-receipt-data').value = receipt || "";

      document.getElementById('form-title').innerText = 'EDIT TRANSAKSI';
      document.getElementById('btn-submit').innerText = 'Update Transaksi';
      document.getElementById('btn-cancel').style.display = 'block';
    }

    function resetForm() {
      document.getElementById('tx-id').value = '';
      document.getElementById('tx-receipt-data').value = '';
      document.getElementById('tx-form').reset();
      document.getElementById('date').valueAsDate = new Date();
      document.getElementById('form-title').innerText = 'TAMBAH TRANSAKSI BARU';
      document.getElementById('btn-submit').innerText = 'Simpan Transaksi';
      document.getElementById('btn-cancel').style.display = 'none';
      currentReceiptBase64 = "";
    }

    function deleteTransaction(id) {
      if (confirm('Apakah Anda yakin ingin menghapus transaksi ini?')) {
        db.ref('transactions/' + id).remove();
      }
    }

    function showReceipt(receiptData) {
      document.getElementById('modal-img').src = receiptData;
      document.getElementById('receipt-modal').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('receipt-modal').style.display = 'none';
    }

    db.ref('transactions').on('value', (snapshot) => {
      const data = snapshot.val();
      let totalSaldo = 0;
      const listEl = document.getElementById('tx-list');
      listEl.innerHTML = '';

      if (data) {
        Object.keys(data).forEach(key => {
          const tx = data[key];
          
          if (tx.type === 'pemasukan') {
            totalSaldo += tx.amount;
          } else {
            totalSaldo -= tx.amount;
          }

          const hasReceipt = tx.receipt && tx.receipt.length > 0;

          const li = document.createElement('li');
          li.className = 'transaction-item';
          li.innerHTML = `
            <div class="tx-left">
              <div class="tx-icon ${tx.type}">${tx.type === 'pemasukan' ? '↑' : '↓'}</div>
              <div class="tx-info">
                <h4>${tx.desc}</h4>
                <p>Tans Syariah Wallet</p>
              </div>
            </div>
            <div class="tx-right">
              <div class="amount ${tx.type}">
                Rp ${tx.amount.toLocaleString('id-ID')}
              </div>
              <p style="font-size: 11px; color: var(--text-muted);">${tx.type}</p>
              <div class="action-btns">
                ${hasReceipt ? `<button class="btn-action btn-nota" onclick="showReceipt('${tx.receipt}')">📄 Nota</button>` : ''}
                <button class="btn-action btn-edit" onclick="editTransaction('${key}', '${tx.date || ''}', '${tx.desc}', ${tx.amount}, '${tx.type}', '${tx.wallet}', '${tx.category}', '${tx.receipt || ''}')">Edit</button>
                <button class="btn-action btn-delete" onclick="deleteTransaction('${key}')">Hapus</button>
              </div>
            </div>
          `;
          listEl.prepend(li);
        });
      }

      document.getElementById('total-saldo').innerText = `Rp ${totalSaldo.toLocaleString('id-ID')}`;
    });
  </script>
</body>
</html>
